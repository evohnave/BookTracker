[project]
name = "booktracker"
version = "1.1.1"
description = "Personal book collection tracker"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.9"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "jinja2",
    "httpx",
    "python-multipart",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
]

[tool.uv]
default-groups = ["dev"]  # This makes "dev" dependencies install by default with `uv sync`
