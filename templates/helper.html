<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ISBN Link Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 40px 20px;
            background: #f9f9f9;
            color: #333;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            margin: 0 auto;
            max-width: 900px;          /* ← made wider */
            width: 100%;
            box-sizing: border-box;
        }
        @media (max-width: 960px) {
            .container {
                max-width: 100%;
                padding: 28px 20px;
            }
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 1.05rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 24px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 4px rgba(52,152,219,0.12);
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2980b9;
        }
        #results {
            margin-top: 36px;
            display: none;
        }
        .link-item {
            margin: 20px 0;
            font-size: 1.1rem;
        }
        .link-item a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 2px solid #3498db;
            padding-bottom: 2px;
            transition: all 0.2s;
            word-break: break-all;
        }
        .link-item a:hover {
            color: #3498db;
            border-bottom-color: transparent;
        }
        .label {
            font-weight: bold;
            color: #555;
            margin-right: 12px;
            min-width: 110px;
            display: inline-block;
        }

        /* Center the whole thing vertically a bit nicer on tall screens */
        body > *:first-child {
            margin-top: min(8vh, 60px);
        }
    </style>
</head>
<body>

    <h1>ISBN Link Generator</h1>

    <div class="container">
        <label for="isbn">Enter ISBN (10 or 13 digits):</label>
        <input type="text" id="isbn" placeholder="e.g. 9780140328721  or  0140328726" autocomplete="off">

        <button onclick="generateLinks()">Generate Links</button>

        <div id="results">
            <div class="link-item">
                <span class="label">OpenLibrary:</span>
                <a id="openlibrary-link" href="#" target="_blank">https://openlibrary.org/isbn/...</a>
            </div>
            <div class="link-item">
                <span class="label">Google Books:</span>
                <a id="googlebooks-link" href="#" target="_blank">https://www.googleapis.com/books/v1/volumes?q=isbn:...</a>
            </div>
            <div class="link-item">
                <span class="label">Library Of Congress:</span>
                <a id="loc-link" href="#" target="_blank">https://lx2.loc.gov:210/lcdb?version...</a>
            </div>
        </div>
    </div>

    <script>
        function generateLinks() {
            const isbnInput = document.getElementById('isbn').value.trim();
            const resultsDiv = document.getElementById('results');
            
            const cleanIsbn = isbnInput.replace(/[^0-9X]/gi, '');
            
            if (cleanIsbn.length === 0) {
                alert('Please enter an ISBN');
                return;
            }

            const openLibUrl = `https://openlibrary.org/isbn/${cleanIsbn}.json`;
            const googleUrl  = `https://www.googleapis.com/books/v1/volumes?q=isbn:${cleanIsbn}`;
            const locUrl     = `http://lx2.loc.gov:210/lcdb?version=1.1&operation=searchRetrieve&query=bath.isbn=:${cleanIsbn}&maximumRecords=1&recordSchema=mods`;
                            
            document.getElementById('openlibrary-link').href = openLibUrl;
            document.getElementById('openlibrary-link').textContent = openLibUrl;
            
            document.getElementById('googlebooks-link').href = googleUrl;
            document.getElementById('googlebooks-link').textContent = googleUrl;

            document.getElementById('loc-link').href = locUrl;
            document.getElementById('loc-link').textContent = locUrl;

            resultsDiv.style.display = 'block';
        }

        document.getElementById('isbn').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateLinks();
            }
        });
    </script>

</body>
</html>
